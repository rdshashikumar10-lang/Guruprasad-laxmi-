<!doctype html>
<html lang="kn" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L & G – Wedding Invitation · ಶುಭ ವಿವಾಹ ಆಮಂತ್ರಣ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+Kannada:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf1e4;--cream2:#f3e2cc;--maroon:#6b1420;--maroon2:#8e2236;--teal:#0f3d3a;--gold:#c9a24a;--gold2:#ecd28e;--ink:#3d1a22;--mut:#7a5a4f;--card:#fffaf3;--shadow:0 14px 34px #4a1a2030;--hf:"Noto Serif Kannada",serif;--bf:"Noto Sans Kannada",system-ui,sans-serif}
html[lang=en]{--hf:"Cormorant Garamond","Noto Serif Kannada",serif;--bf:system-ui,-apple-system,"Segoe UI","Noto Sans Kannada",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--bf);line-height:1.7;overflow-x:hidden}
body{background:radial-gradient(circle at 50% -10%,#fff8ec,var(--cream) 60%,var(--cream2))}
h1,h2,h3{font-family:var(--hf);margin:.2em 0;line-height:1.3}
img{display:block;max-width:100%}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px}
section{position:relative;padding:38px 0;text-align:center}
.kicker{letter-spacing:.14em;font-size:13px;font-weight:600;color:var(--gold);margin:0}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font-size:20px;margin:14px auto;max-width:300px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
h2.st{color:var(--maroon);font-size:clamp(24px,7vw,30px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font:600 15px var(--bf);background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:#fff;text-decoration:none;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.g{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon);box-shadow:none}
.btn.teal{background:var(--teal);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.names{font-size:clamp(32px,10vw,46px);margin:14px 0 4px;background:linear-gradient(100deg,var(--maroon) 35%,var(--gold) 50%,var(--maroon) 65%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.names em{font-style:normal;-webkit-text-fill-color:var(--gold)}

/* language switch */
#lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:70;display:flex;border-radius:999px;background:#fffaf3ee;border:1.5px solid var(--gold);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(6px)}
#lang button{border:0;background:transparent;padding:11px 16px;font:600 13px var(--bf);color:var(--maroon);cursor:pointer}
#lang button.on{background:var(--maroon);color:#fff}

/* cover */
body.locked{height:100vh;height:100dvh;overflow:hidden}
#open{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;text-align:center;color:#f7e7d0;background:radial-gradient(circle at 50% 35%,#8e2236,var(--maroon) 55%,#35070e);transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .6s .2s}
#open.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
#open:before{content:"";position:absolute;inset:14px;border:1.5px solid var(--gold);border-radius:28px;opacity:.8}
#open:after{content:"";position:absolute;inset:22px;border:1px dashed #c9a24a77;border-radius:22px}
#open .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(#ecd28e40,transparent 65%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.6}}
.ob{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.ob .kicker{color:var(--gold2)}
.mono{position:relative;width:190px;height:190px;margin:16px auto 8px;border-radius:50%;display:grid;place-items:center}
.mono:before,.mono:after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--gold2)}
.mono:after{inset:10px;border-color:var(--gold)}
.mono .spin{position:absolute;inset:-14px;border-radius:50%;border:1.5px dashed var(--gold);animation:spin 24s linear infinite}
.mono .spin.r{inset:-26px;opacity:.45;animation-duration:40s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mono .lt{font-family:"Cinzel",serif;font-weight:700;font-size:56px;color:var(--gold2);letter-spacing:.04em;text-shadow:0 3px 12px #0006}
.mono .lt em{font-style:normal;font-size:24px;color:#fff;margin:0 3px}
.ot{font-family:var(--hf);font-size:clamp(20px,6vw,25px);margin:12px 0 0;color:#fff}
.od{font-family:var(--hf);font-size:clamp(24px,7.5vw,32px);color:var(--gold2);margin:0}
.odt{font-size:14px;letter-spacing:.08em;opacity:.9;margin:2px 0 18px}
#open .btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--maroon);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ecd28e55}50%{box-shadow:0 0 0 12px #ecd28e00,0 0 0 0 #0000}}

/* photo */
.arch{position:relative;width:min(78vw,300px);aspect-ratio:3/4;margin:18px auto 0;border-radius:999px 999px 18px 18px;padding:8px;background:linear-gradient(160deg,var(--gold2),var(--gold),#8c6a22);box-shadow:var(--shadow)}
.arch:before{content:"";position:absolute;inset:-14px;border-radius:999px 999px 26px 26px;border:1px dashed var(--gold);opacity:.7}
.arch img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 12px 12px}
.cap{font-family:var(--hf);color:var(--maroon);margin:20px 0 0;font-size:18px}

/* date */
.cal{background:var(--card);border:1px solid #d9bd8c88;border-radius:26px;box-shadow:var(--shadow);padding:0 0 22px;overflow:hidden;max-width:360px;margin:16px auto 0}
.cal .mo{background:linear-gradient(135deg,var(--maroon),var(--maroon2));color:var(--gold2);padding:10px;font-family:var(--hf);font-size:20px;letter-spacing:.08em}
.cal .dy{font-family:"Cinzel",serif;font-size:84px;line-height:1.1;color:var(--maroon);margin:10px 0 0;font-weight:700}
.cal .wd{font-family:var(--hf);font-size:22px;color:var(--maroon)}
.cal .tm{color:var(--mut);margin:6px 0 0}
.band{padding:34px 16px;border-radius:26px;margin:18px 0 0;background:var(--teal);color:#f6ead6}
.band .kicker{color:var(--gold2)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;margin:18px auto 0}
.cd div{border:1px solid #c9a24a88;border-radius:16px;padding:12px 4px;background:#ffffff0d}
.cd b{display:block;font-family:"Cinzel",serif;font-size:30px;color:var(--gold2);line-height:1.1}
.cd span{font-size:12px;opacity:.85}

/* map */
.venue{background:linear-gradient(160deg,var(--maroon),#4a0d17);color:#f7e7d0;border-radius:26px;padding:34px 16px;margin:38px 0 0}
.venue .kicker{color:var(--gold2)}
.venue h2{font-size:clamp(21px,6vw,27px);color:#fff;margin:8px 0 2px}
.venue p{margin:2px 0;opacity:.92}
.map{margin:18px auto 0;border-radius:18px;overflow:hidden;border:2px solid var(--gold);height:230px;background:#0002}
.map iframe{width:100%;height:100%;border:0}

/* card, timeline, families */
.card{background:var(--card);border:1px solid #d9bd8c66;border-radius:26px;box-shadow:var(--shadow);padding:26px 22px}
.card p{margin:.6em 0}
.tl{position:relative;margin:18px 0 0}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(var(--gold),var(--maroon),var(--gold));transform:translateX(-50%)}
.ev{position:relative;width:50%;padding:16px 18px;margin-bottom:22px;background:var(--card);border:1px solid #d9bd8c66;border-radius:18px;box-shadow:var(--shadow)}
.ev.l{text-align:right}.ev.r{margin-left:50%;text-align:left}
.ev .dot{position:absolute;top:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--cream);border:2px solid var(--gold);box-shadow:0 0 0 6px var(--cream)}
.ev.l .dot{right:-21px}.ev.r .dot{left:-21px}
.ev h3{font-size:18px;color:var(--maroon);margin:4px 0}
.ev .t{font-size:13px;color:var(--gold);font-weight:600}
.ev .d{font-size:14px;color:var(--mut);margin:4px 0 0}
@media (max-width:420px){.ev{width:100%;margin-left:0!important;text-align:left!important;padding:16px 16px 16px 70px;min-height:84px}.tl:before{display:none}.ev .dot{left:14px!important;right:auto!important;top:18px;box-shadow:none}}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.fam div{background:var(--card);border:1px solid #d9bd8c66;border-radius:18px;padding:16px 10px}
.fam small{display:block;color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.06em}
.fam b{display:block;font-family:var(--hf);color:var(--maroon);font-size:17px;margin-top:4px}
.fam p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.quote{min-height:96px;font-family:var(--hf);font-size:20px;color:var(--maroon);display:grid;place-items:center;padding:6px}
.quote small{display:block;color:var(--gold);font-size:13px;margin-top:6px}
.foot{text-align:center;padding:30px 16px 60px;color:var(--mut)}
.foot .names{font-size:32px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.photo{isolation:isolate;padding-top:64px}
html{-webkit-text-size-adjust:100%}button,a{touch-action:manipulation}
.paintbg{position:absolute;left:-16px;right:-16px;top:0;height:80%;z-index:-1;overflow:hidden;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.paintbg img{width:100%;height:100%;object-fit:cover;filter:saturate(1.5) contrast(1.05) blur(3px);opacity:.4;transform:scale(1.15)}
.cbg{position:absolute;left:0;right:0;bottom:0;width:100%;height:50%;opacity:.45;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%);pointer-events:none}
.frame{position:relative;max-width:420px;margin:18px auto 0;padding:12px;border-radius:8px;background:linear-gradient(145deg,#f3dc9a,var(--gold) 45%,#8c6a22 70%,var(--gold2));box-shadow:0 18px 40px #4a1a2055,inset 0 0 0 2px #fff6}
.frame .mat{background:#fff7e8;padding:10px;border:1px solid #8c6a2288}
.frame svg{display:block;width:100%;height:auto;aspect-ratio:400/260}
.plq{font-family:var(--hf);color:var(--maroon);margin:14px 0 0;font-size:17px}
.cal{position:relative}
.cc{position:absolute;right:4px;bottom:0;width:110px;height:180px;opacity:.12;pointer-events:none}
.fc{width:64px;height:107px;margin:0 auto}
</style>
</head>
